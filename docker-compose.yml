services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Entire repository → /var/www/html (app/, public/, migrations/, vendor/, …)
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-priv_lending}
      MYSQL_USER: ${MYSQL_USER:-priv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-priv}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
